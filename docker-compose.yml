version: "3.8"

services:
  backend:
    image: ghcr.io/adrianhuszka/student-space-backend:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-student_space}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ghcr.io/adrianhuszka/student-space-frontend:latest
    environment:
      API_URL: http://backend:8080
    ports:
      - "4000:4000"
    depends_on:
      - backend

volumes:
  postgres_data:
